<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101010;
        color: #f2f2f2;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        text-align: center;
      }
      #title {
        font-size: 9vh;
        font-weight: 700;
        color: #ff7043;
      }
      #detail {
        font-size: 4vh;
        opacity: 0.75;
        max-width: 80vw;
      }
      #source {
        position: fixed;
        bottom: 3vh;
        font-size: 2.5vh;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div id="title">Connecting to Ontime</div>
    <div id="detail"></div>
    <div id="source"></div>
    <div id="pulse" style="position: fixed; left: 0; top: 0; width: 1px; height: 1px"></div>
    <script>
      function setStatus(title, detail, source) {
        document.getElementById('title').textContent = title;
        document.getElementById('detail').textContent = detail;
        document.getElementById('source').textContent = source;
      }

      // an off-screen page only hands over frames when it changes: flicker one pixel so the card
      // reaches Syphon straight after being switched to
      let pulseOn = false;
      setInterval(() => {
        pulseOn = !pulseOn;
        document.getElementById('pulse').style.background = pulseOn ? '#111111' : '#101010';
      }, 500);
    </script>
  </body>
</html>
